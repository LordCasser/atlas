[package]
name = "atlas-mcp"
version = "1.1.0"
edition = "2024"
description = "Atlas MCP (Model Context Protocol) server — tools for IDE/agent integration"
license = "MIT"

[dependencies]
atlas-engine = { path = "../atlas-engine" }
domain-rules = { path = "../atlas-engine/crates/domain_rules" }
anyhow = "1"
blake3 = "1"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rmcp = { version = "=1.7.0", default-features = false, features = ["server", "transport-io"] }
tokio = { version = "1", features = ["io-std", "io-util", "macros", "rt-multi-thread"] }
tracing = "0.1"
