[package]
name = "atlas-mcp"
version = "0.1.0"
edition = "2024"
description = "Atlas MCP (Model Context Protocol) server — tools for IDE/agent integration"
license = "MIT"

[dependencies]
atlas-engine = { path = "../atlas-engine" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-std", "io-util", "macros", "rt-multi-thread"] }
tracing = "0.1"
