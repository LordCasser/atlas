[package]
name = "filesync"
version = "1.4.1"
edition = "2024"
description = "Atlas file watcher and incremental sync engine"
license = "MIT"

[dependencies]
types = { path = "../types" }
db = { path = "../db" }
analysis = { path = "../analysis" }
extraction = { path = "../extraction" }
graph = { path = "../graph" }
resolution = { path = "../resolution" }
workspace = { path = "../workspace" }
anyhow = "1"
blake3 = "1"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
notify = { version = "7", optional = true }

[dev-dependencies]
extraction = { path = "../extraction", features = ["typescript"] }
tempfile = "3"

[features]
sync = ["dep:notify"]
