[package]
name = "filesync"
version.workspace = true
edition.workspace = true
description = "Atlas file watcher and incremental sync engine"
license = "MIT"

[dependencies]
types = { path = "../types" }
db = { path = "../db" }
analysis = { path = "../analysis" }
extraction = { path = "../extraction" }
graph = { path = "../graph" }
resolution = { path = "../resolution" }
workspace = { path = "../workspace" }
anyhow = "1"
blake3 = "1"
rayon = "1"
serde_json = "1"
tracing = "0.1"
notify = { version = "7", optional = true }

[dev-dependencies]
extraction = { path = "../extraction", features = ["typescript", "python"] }
encoding_rs = "0.8"
tempfile = "3"

[features]
sync = ["dep:notify"]
