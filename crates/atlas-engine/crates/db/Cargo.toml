[package]
name = "db"
version.workspace = true
edition.workspace = true
description = "Atlas SQLite persistence layer — Store, schema, FTS5 search"
license = "MIT"

[dependencies]
types = { path = "../types" }
anyhow = "1"
blake3 = "1"
hex = "0.4"
rusqlite = { version = "0.39", features = ["bundled"] }
serde_json = "1"
tracing = "0.1"

[dev-dependencies]
tempfile = "3"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
