[package]
name = "search"
version = "1.4.1"
edition = "2024"
description = "Atlas fuzzy search engine — query parsing, substring/fuzzy matching, scoring"
license = "MIT"

[dependencies]
types = { path = "../types" }
db = { path = "../db" }
graph = { path = "../graph" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
tracing = "0.1"

[dev-dependencies]
tempfile = "3"

[features]
default = ["cangjie"]

cangjie = []  # enables Cangjie-specific keyword search (language-specific)
