[package]
name = "focus_materialize"
version.workspace = true
edition.workspace = true
description = "Focus materialize: on-demand dataflow (internal) — planner, loader, and hardcoded budgets"
license = "MIT"

[dependencies]
types = { path = "../types", default-features = false }
db = { path = "../db" }
extraction = { path = "../extraction", default-features = false }
workspace = { path = "../workspace" }
anyhow = "1"
tracing = "0.1"

[features]
default = ["typescript", "arkts", "cangjie"]

typescript = ["extraction/typescript"]
arkts = ["extraction/arkts"]
cangjie = ["extraction/cangjie"]
