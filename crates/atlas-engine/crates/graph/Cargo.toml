[package]
name = "graph"
version.workspace = true
edition.workspace = true
description = "Atlas knowledge graph engine — BFS/DFS traversal, callers/callees, impact analysis"
license = "MIT"

[dependencies]
types = { path = "../types", default-features = false }
db = { path = "../db" }
anyhow = "1"
rayon = "1"
serde_json = "1"
tracing = "0.1"

[dev-dependencies]
extraction = { path = "../extraction", default-features = false, features = ["typescript", "c"] }
resolution = { path = "../resolution" }
tempfile = "3"
blake3 = "1"
