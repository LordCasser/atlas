[package]
name = "graph"
version = "1.3.1"
edition = "2024"
description = "Atlas knowledge graph engine — BFS/DFS traversal, callers/callees, impact analysis"
license = "MIT"

[dependencies]
types = { path = "../types" }
db = { path = "../db" }
anyhow = "1"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"

[dev-dependencies]
extraction = { path = "../extraction", features = ["typescript"] }
resolution = { path = "../resolution" }
tempfile = "3"
blake3 = "1"
