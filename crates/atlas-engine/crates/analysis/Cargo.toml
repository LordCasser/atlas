[package]
name = "analysis"
version.workspace = true
edition.workspace = true
description = "Atlas analysis engine — function summaries, trace analysis, call-path exploration"
license = "MIT"

[dependencies]
types = { path = "../types", default-features = false }
db = { path = "../db" }
domain-rules = { path = "../domain_rules" }
workspace = { path = "../workspace" }
anyhow = "1"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# tree-sitter-typescript is only used in tests (summary.rs), but Cargo feature flags
# can only reference optional deps in [dependencies], not [dev-dependencies].
tree-sitter-typescript = { version = "0.23", optional = true }

[dev-dependencies]
extraction = { path = "../extraction", default-features = false }
tempfile = "3"
tree-sitter = "0.26"

[features]
default = ["typescript", "python", "java", "go", "rust", "csharp", "kotlin", "ruby", "php"]

typescript = ["dep:tree-sitter-typescript", "types/typescript", "extraction/typescript"]
python = ["types/python"]
java = ["types/java"]
go = ["types/go"]
rust = ["types/rust"]
csharp = ["types/csharp"]
kotlin = ["types/kotlin"]
ruby = ["types/ruby"]
php = ["types/php"]
