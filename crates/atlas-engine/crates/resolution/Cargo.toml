[package]
name = "resolution"
version = "1.4.2"
edition = "2024"
description = "Atlas reference resolution — import resolver, name matching, path aliases, builtins"
license = "MIT"

[dependencies]
types = { path = "../types" }
db = { path = "../db" }
anyhow = "1"
blake3 = "1"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"

[dev-dependencies]
extraction = { path = "../extraction", features = ["typescript"] }
graph = { path = "../graph" }
tempfile = "3"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
