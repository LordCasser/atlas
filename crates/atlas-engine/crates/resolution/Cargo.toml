[package]
name = "resolution"
version.workspace = true
edition.workspace = true
description = "Atlas reference resolution — import resolver, name matching, path aliases, builtins"
license = "MIT"

[dependencies]
types = { path = "../types", default-features = false }
db = { path = "../db" }
search = { path = "../search", default-features = false }
anyhow = "1"
blake3 = "1"
rayon = "1"
serde_json = "1"
tracing = "0.1"

[dev-dependencies]
extraction = { path = "../extraction", default-features = false, features = ["typescript", "cpp"] }
graph = { path = "../graph" }
tempfile = "3"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
