[package]
name = "atlas-engine"
version = "1.0.0"
edition = "2024"
description = "Atlas Engine — unified facade crate: extraction, resolution, graph, trace"
license = "MIT"

[dependencies]
types = { path = "crates/types" }
workspace = { path = "crates/workspace" }
db = { path = "crates/db" }
extraction = { path = "crates/extraction" }
resolution = { path = "crates/resolution" }
graph = { path = "crates/graph" }
analysis = { path = "crates/analysis" }
search = { path = "crates/search" }
context = { path = "crates/context" }
filesync = { path = "crates/filesync" }
lazy = { path = "crates/lazy" }
anyhow = "1"
blake3 = "1"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
tracing = "0.1"

[dev-dependencies]
serde_json = "1"
tempfile = "3"

[features]
default = ["typescript", "javascript", "python"]

# ── Language features (aggregated from sub-crates) ──
typescript = ["types/typescript", "extraction/typescript", "analysis/typescript"]
javascript = ["types/javascript", "extraction/javascript"]
python = ["types/python", "extraction/python"]
java = ["types/java", "extraction/java"]
c = ["types/c", "extraction/c"]
cpp = ["types/cpp", "extraction/cpp"]
arkts = ["typescript", "types/arkts", "extraction/arkts"]
cangjie = ["types/cangjie", "extraction/cangjie"]
go = ["types/go", "extraction/go"]
csharp = ["types/csharp", "extraction/csharp"]
rust = ["types/rust", "extraction/rust"]
php = ["types/php", "extraction/php"]
ruby = ["types/ruby", "extraction/ruby"]
bash = ["types/bash", "extraction/bash"]
kotlin = ["types/kotlin", "extraction/kotlin"]

all-languages = [
    "typescript", "javascript", "python", "java",
    "c", "cpp", "arkts", "cangjie", "go", "csharp", "rust", "php", "ruby", "kotlin",
]
