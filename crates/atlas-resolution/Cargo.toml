[package]
name = "atlas-resolution"
version = "0.1.0"
edition = "2024"
description = "Atlas reference resolution — import resolver, name matching, path aliases, builtins"
license = "MIT"

[dependencies]
atlas-types = { path = "../atlas-types" }
atlas-db = { path = "../atlas-db" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
atlas-extraction = { path = "../atlas-extraction" }
atlas-graph = { path = "../atlas-graph" }
tempfile = "3"
