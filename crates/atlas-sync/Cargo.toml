[package]
name = "atlas-sync"
version = "0.1.0"
edition = "2024"
description = "Atlas file watcher and incremental sync engine"
license = "MIT"

[dependencies]
atlas-types = { path = "../atlas-types" }
atlas-db = { path = "../atlas-db" }
atlas-extraction = { path = "../atlas-extraction" }
atlas-graph = { path = "../atlas-graph" }
atlas-resolution = { path = "../atlas-resolution" }
atlas-workspace = { path = "../atlas-workspace" }
anyhow = "1"
blake3 = "1"
serde = { version = "1", features = ["derive"] }
tracing = "0.1"
notify = { version = "7", optional = true }

[dev-dependencies]
tempfile = "3"

[features]
sync = ["dep:notify"]
