[package]
name = "atlas-cli"
version.workspace = true
edition.workspace = true
description = "Atlas CLI — command-line interface and binary entry point"
license = "MIT"
repository = "https://github.com/LordCasser/atlas"
homepage = "https://github.com/LordCasser/atlas"
documentation = "https://github.com/LordCasser/atlas#readme"

[[bin]]
name = "atlas"
path = "src/main.rs"

[dependencies]
atlas-engine = { path = "../atlas-engine", default-features = false }
atlas-mcp = { path = "../atlas-mcp", default-features = false }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
ratatui = "0.29"
ctrlc = "3"
indicatif = "0.18.4"
rusqlite = { version = "0.39", features = ["bundled"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tokio = { version = "1", features = ["io-std", "io-util", "macros", "rt-multi-thread"], optional = true }

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
tempfile = "3"

[features]
default = ["typescript", "javascript", "python", "java", "c", "cpp", "arkts", "cangjie", "go", "csharp", "rust", "php", "ruby", "kotlin"]
mcp = ["dep:tokio"]
typescript = ["atlas-engine/typescript", "atlas-mcp/typescript"]
javascript = ["atlas-engine/javascript", "atlas-mcp/javascript"]
python = ["atlas-engine/python", "atlas-mcp/python"]
java = ["atlas-engine/java", "atlas-mcp/java"]
c = ["atlas-engine/c", "atlas-mcp/c"]
cpp = ["atlas-engine/cpp", "atlas-mcp/cpp"]
arkts = ["atlas-engine/arkts", "atlas-mcp/arkts"]
cangjie = ["atlas-engine/cangjie", "atlas-mcp/cangjie"]
go = ["atlas-engine/go", "atlas-mcp/go"]
csharp = ["atlas-engine/csharp", "atlas-mcp/csharp"]
rust = ["atlas-engine/rust", "atlas-mcp/rust"]
php = ["atlas-engine/php", "atlas-mcp/php"]
ruby = ["atlas-engine/ruby", "atlas-mcp/ruby"]
kotlin = ["atlas-engine/kotlin", "atlas-mcp/kotlin"]
