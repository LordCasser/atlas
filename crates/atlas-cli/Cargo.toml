[package]
name = "atlas-cli"
version = "1.5.2"
edition = "2024"
description = "Atlas CLI — command-line interface and binary entry point"
license = "MIT"
repository = "https://github.com/LordCasser/atlas"
homepage = "https://github.com/LordCasser/atlas"
documentation = "https://github.com/LordCasser/atlas#readme"

[[bin]]
name = "atlas"
path = "src/main.rs"

[dependencies]
atlas-engine = { path = "../atlas-engine" }
atlas-mcp = { path = "../atlas-mcp" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
ratatui = "0.29"
ctrlc = "3"
indicatif = "0.18.4"
rusqlite = { version = "0.39", features = ["bundled"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tokio = { version = "1", features = ["io-std", "io-util", "macros", "rt-multi-thread"], optional = true }

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
tempfile = "3"

[features]
default = ["typescript", "javascript", "python", "java", "c", "cpp", "arkts", "cangjie", "go", "csharp", "rust", "php", "ruby", "kotlin"]
mcp = ["dep:tokio"]
typescript = ["atlas-engine/typescript"]
javascript = ["atlas-engine/javascript"]
python = ["atlas-engine/python"]
java = ["atlas-engine/java"]
c = ["atlas-engine/c"]
cpp = ["atlas-engine/cpp"]
arkts = ["atlas-engine/arkts"]
cangjie = ["atlas-engine/cangjie"]
go = ["atlas-engine/go"]
csharp = ["atlas-engine/csharp"]
rust = ["atlas-engine/rust"]
php = ["atlas-engine/php"]
ruby = ["atlas-engine/ruby"]
kotlin = ["atlas-engine/kotlin"]
