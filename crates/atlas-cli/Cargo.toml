[package]
name = "atlas-cli"
version = "1.0.0"
edition = "2024"
description = "Atlas CLI — command-line interface and binary entry point"
license = "MIT"

[[bin]]
name = "atlas"
path = "src/main.rs"

[dependencies]
atlas-engine = { path = "../atlas-engine" }
atlas-mcp = { path = "../atlas-mcp", optional = true }
anyhow = "1"
atty = "0.2"
clap = { version = "4", features = ["derive"] }
crossterm = "0.28"
ctrlc = "3"
ratatui = "0.29"
rayon = "1"
rusqlite = { version = "0.39", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
blake3 = "1"
hex = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tokio = { version = "1", features = ["io-std", "io-util", "macros", "rt-multi-thread"], optional = true }

[dev-dependencies]
atlas-mcp = { path = "../atlas-mcp" }
tempfile = "3"

[features]
default = ["typescript", "javascript", "python"]
mcp = ["atlas-mcp", "dep:tokio"]
typescript = ["atlas-engine/typescript"]
javascript = ["atlas-engine/javascript"]
python = ["atlas-engine/python"]
java = ["atlas-engine/java"]
c = ["atlas-engine/c"]
cpp = ["atlas-engine/cpp"]
arkts = ["atlas-engine/arkts"]
# cangjie = ["atlas-engine/cangjie"]
go = ["atlas-engine/go"]
csharp = ["atlas-engine/csharp"]
rust = ["atlas-engine/rust"]
php = ["atlas-engine/php"]
ruby = ["atlas-engine/ruby"]
bash = ["atlas-engine/bash"]
# kotlin = ["atlas-engine/kotlin"]
all-languages = [
    # All DataflowBasic + Symbolic languages with verified lexical/dataflow compilation.
    # Cangjie (ABI 15) is now compatible with tree-sitter 0.26 (MAX_ABI ≥ 15).
    # Bash is explicitly Symbolic-only with no dataflow support, opt-in only.
    "typescript", "javascript", "python", "java",
    "c", "cpp", "arkts", "go", "csharp", "rust", "php", "ruby",
]
