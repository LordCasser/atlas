[package]
name = "atlas-graph"
version = "0.1.0"
edition = "2024"
description = "Atlas knowledge graph engine — BFS/DFS traversal, callers/callees, impact analysis"
license = "MIT"

[dependencies]
atlas-types = { path = "../atlas-types" }
atlas-db = { path = "../atlas-db" }
anyhow = "1"
rayon = "1"
serde = { version = "1", features = ["derive"] }
tracing = "0.1"

[dev-dependencies]
atlas-extraction = { path = "../atlas-extraction" }
atlas-resolution = { path = "../atlas-resolution" }
tempfile = "3"
