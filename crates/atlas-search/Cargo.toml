[package]
name = "atlas-search"
version = "0.1.0"
edition = "2024"
description = "Atlas fuzzy search engine — query parsing, substring/fuzzy matching, scoring"
license = "MIT"

[dependencies]
atlas-types = { path = "../atlas-types" }
atlas-db = { path = "../atlas-db" }
atlas-graph = { path = "../atlas-graph" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
tempfile = "3"

[features]
cangjie = []  # enables Cangjie-specific keyword search (language-specific)
