[package]
name = "atlas-analysis"
version = "0.1.0"
edition = "2024"
description = "Atlas analysis engine — function summaries, trace analysis, call-path exploration"
license = "MIT"

[dependencies]
atlas-types = { path = "../atlas-types" }
atlas-db = { path = "../atlas-db" }
atlas-workspace = { path = "../atlas-workspace" }
anyhow = "1"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
# tree-sitter-typescript is only used in tests (summary.rs), but Cargo feature flags
# can only reference optional deps in [dependencies], not [dev-dependencies].
tree-sitter-typescript = { version = "0.23", optional = true }

[dev-dependencies]
atlas-extraction = { path = "../atlas-extraction" }
serde_json = "1"
tempfile = "3"
tree-sitter = "0.24"

[features]
typescript = ["dep:tree-sitter-typescript", "atlas-extraction/typescript"]
