interface:
  display_name: "Atlas"
  short_description: "MCP-first code-graph facts (Focus, no full index)"
  default_prompt: >-
    Use Atlas via MCP only: project(action="open"), then scoped search/calls/trace.
    Never run atlas index or whole-tree sync—Focus builds local structural and
    dataflow on demand. Honor analysis.retry_after_ms with resume_query; do not
    treat sparse Focus callers as repo-wide proof.
