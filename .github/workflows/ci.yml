name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: Test (${{ matrix.crate }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        crate:
          - atlas-engine
          - atlas-mcp
          - atlas-cli
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build -p ${{ matrix.crate }}

      - name: Unit tests
        run: cargo test -p ${{ matrix.crate }} --lib

      - name: Integration tests (atlas-mcp)
        if: matrix.crate == 'atlas-mcp'
        run: cargo test -p atlas-mcp --test '*'

      - name: Doc tests
        if: matrix.crate != 'atlas-mcp'
        run: cargo test -p ${{ matrix.crate }} --doc

      - name: Doc tests (atlas-mcp)
        if: matrix.crate == 'atlas-mcp'
        run: cargo test -p ${{ matrix.crate }} --doc
        continue-on-error: true

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
