name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build (e.g. v0.1.0)'
        required: true

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # ── Linux (musl/static, avoids runner glibc dependency) ───────
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            cross: false
            asset: atlas-linux-x86_64.tar.gz

          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
            cross: false
            asset: atlas-linux-arm64.tar.gz

          # ── Linux (cross-compile; GNU until riscv64 musl C toolchain is available) ──
          - target: riscv64gc-unknown-linux-gnu
            os: ubuntu-latest
            cross: true
            asset: atlas-linux-riscv64.tar.gz

          # ── macOS (Apple Silicon, mainstream) ──────────────────
          - target: aarch64-apple-darwin
            os: macos-latest
            cross: false
            asset: atlas-macos-arm64.tar.gz

          # ── Windows (native) ──────────────────────────────────
          - target: x86_64-pc-windows-msvc
            os: windows-2025-vs2026
            cross: false
            asset: atlas-windows-x86_64.zip

          # ── Windows ARM (cross from Linux via cargo-xwin) ─────
          - target: aarch64-pc-windows-msvc
            os: ubuntu-latest
            xwin: true
            asset: atlas-windows-arm64.zip

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Install cross
        if: matrix.cross
        run: cargo install cross --locked

      - name: Install musl tools (native Linux)
        if: ${{ runner.os == 'Linux' && !matrix.cross && contains(matrix.target, 'linux-musl') }}
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Install cargo-xwin
        if: matrix.xwin
        run: cargo install cargo-xwin --locked

      - name: Install LLVM toolchain (xwin)
        if: matrix.xwin
        run: sudo apt-get update && sudo apt-get install -y lld llvm

      - name: Build (native)
        if: ${{ !matrix.cross && !matrix.xwin }}
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
          CC_aarch64_unknown_linux_musl: musl-gcc
        run: cargo build --release --target ${{ matrix.target }} -p atlas-cli --features mcp

      - name: Build (cross-compile)
        if: matrix.cross
        run: |
          cross build --release \
            --target ${{ matrix.target }} \
            -p atlas-cli \
            --features mcp

      - name: Build (xwin)
        if: matrix.xwin
        run: cargo xwin build --release --target ${{ matrix.target }} -p atlas-cli --features mcp

      - name: Verify Linux binary is static
        if: ${{ runner.os == 'Linux' && contains(matrix.target, 'linux-musl') }}
        run: |
          BIN=target/${{ matrix.target }}/release/atlas
          file "$BIN"
          if readelf -d "$BIN" 2>/dev/null | grep -q 'NEEDED'; then
            echo "Linux release binary has dynamic dependencies:"
            readelf -d "$BIN"
            exit 1
          fi

      - name: Package (Linux / macOS / cross-compiled Windows)
        if: runner.os != 'Windows'
        run: |
          EXE=${{ contains(matrix.target, 'windows') && 'atlas.exe' || 'atlas' }}
          cd target/${{ matrix.target }}/release
          tar czf ../../../${{ matrix.asset }} "$EXE"

      - name: Package (Windows native)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cd target\${{ matrix.target }}\release
          Compress-Archive -Path atlas.exe -DestinationPath ..\..\..\${{ matrix.asset }}

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

      - name: Upload to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ matrix.asset }}
          fail_on_unmatched_files: false
