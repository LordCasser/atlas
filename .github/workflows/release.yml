name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build (e.g. v0.1.0)'
        required: true

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # ── Linux (native) ───────────────────────────────────
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            cross: false
            asset: atlas-linux-x86_64.tar.gz

          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            cross: false
            asset: atlas-linux-arm64.tar.gz

          # ── Linux (cross-compile) ─────────────────────────────
          - target: riscv64gc-unknown-linux-gnu
            os: ubuntu-latest
            cross: true
            asset: atlas-linux-riscv64.tar.gz

          # ── macOS (Apple Silicon, mainstream) ──────────────────
          - target: aarch64-apple-darwin
            os: macos-latest
            cross: false
            asset: atlas-macos-arm64.tar.gz

          # ── Windows (native) ──────────────────────────────────
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            cross: false
            asset: atlas-windows-x86_64.zip

          # ── Windows ARM (cross from Linux via cargo-xwin) ─────
          - target: aarch64-pc-windows-msvc
            os: ubuntu-latest
            xwin: true
            asset: atlas-windows-arm64.zip

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Install cross
        if: matrix.cross
        run: cargo install cross --locked

      - name: Install cargo-xwin
        if: matrix.xwin
        run: cargo install cargo-xwin --locked

      - name: Install LLVM toolchain (xwin)
        if: matrix.xwin
        run: sudo apt-get update && sudo apt-get install -y lld llvm

      - name: Build (native)
        if: ${{ !matrix.cross && !matrix.xwin }}
        run: cargo build --release --target ${{ matrix.target }} -p atlas-cli --features "all-languages,mcp"

      - name: Build (cross-compile)
        if: matrix.cross
        run: |
          cross build --release \
            --target ${{ matrix.target }} \
            -p atlas-cli \
            --features "all-languages,mcp"

      - name: Build (xwin)
        if: matrix.xwin
        run: cargo xwin build --release --target ${{ matrix.target }} -p atlas-cli --features "all-languages,mcp"

      - name: Package (Linux / macOS / cross-compiled Windows)
        if: runner.os != 'Windows'
        run: |
          EXE=${{ contains(matrix.target, 'windows') && 'atlas.exe' || 'atlas' }}
          cd target/${{ matrix.target }}/release
          tar czf ../../../${{ matrix.asset }} "$EXE"

      - name: Package (Windows native)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cd target\${{ matrix.target }}\release
          Compress-Archive -Path atlas.exe -DestinationPath ..\..\..\${{ matrix.asset }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

      - name: Upload to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.asset }}
          fail_on_unmatched_files: false
